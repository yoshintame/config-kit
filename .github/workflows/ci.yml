name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: yoshintame/workflows/.github/workflows/ci.yml@a2dd939289d450e122f98ce19f3ccca6e58c4654 # v1.3.0
    permissions:
      contents: read

  release:
    needs: verify
    if: github.event_name == 'push'
    uses: yoshintame/workflows/.github/workflows/release-semantic.yml@a2dd939289d450e122f98ce19f3ccca6e58c4654 # v1.3.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
